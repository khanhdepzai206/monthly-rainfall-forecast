{% extends "_base.html" %}

{% block title %}Đăng nhập — Dự báo lượng mưa{% endblock %}

{% block content %}
  <div class="glass-card p-4 p-md-5" style="max-width:520px; margin: 0 auto;">
    <h1 class="page-title"><i class="fa-solid fa-right-to-bracket me-2"></i>Đăng nhập</h1>
    <p class="page-subtitle">Đăng nhập để lưu/đồng bộ các thao tác của bạn.</p>

    <div class="divider my-4"></div>

    {% if form.errors %}
      <div class="alert alert-danger">
        <i class="fa-solid fa-triangle-exclamation me-2"></i>
        Sai username hoặc password.
      </div>
    {% endif %}

    <form method="post" class="d-grid gap-3">
      {% csrf_token %}
      <div>
        <label class="form-label">Username</label>
        <input type="text" name="username" required class="form-control" autocomplete="username" />
      </div>
      <div>
        <label class="form-label">Password</label>
        <input type="password" name="password" required class="form-control" autocomplete="current-password" />
      </div>
      <input type="hidden" name="next" value="{{ next }}" />
      <button type="submit" class="btn btn-brand">
        <i class="fa-solid fa-lock me-2"></i>Đăng nhập
      </button>
    </form>
  </div>
{% endblock %}
